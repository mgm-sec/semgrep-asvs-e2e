- id: semgrep-asvs
  name: semgrep-asvs
  description: Semgrep with vendored rules, reported against OWASP ASVS 4.0.3 (report-only unless args include --strict)
  entry: semgrep-asvs scan --format text --secrets none
  language: python
  types_or: [python, php, javascript, jsx, ts, tsx, go]
  require_serial: true
- id: semgrep-asvs-secrets
  name: semgrep-asvs secrets gate (gitleaks)
  description: Block commits whose staged changes contain secrets (gitleaks, always blocking; ASVS V2.10.4 / V6.4.1). Installs the pinned gitleaks into ~/.cache/semgrep-asvs if absent.
  entry: semgrep-asvs secrets-hook
  language: python
  pass_filenames: false
