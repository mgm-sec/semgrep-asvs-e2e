rules:
- id: constant-time-compare
  languages: [javascript, typescript]
  severity: WARNING
  message: >-
    HMAC digest compared with ==/===, which is not constant-time and leaks timing information.
    Use crypto.timingSafeEqual(Buffer.from(expected), Buffer.from(received)).
  metadata:
    asvs: [V6.2.8]
    cwe: ["CWE-385: Covert Timing Channel"]
    category: security
    technology: [node.js]
    references:
    - https://nodejs.org/api/crypto.html#cryptotimingsafeequala-b
  pattern-either:
  - patterns:
    - pattern-either:
      - pattern: $A == $B
      - pattern: $A === $B
      - pattern: $A != $B
      - pattern: $A !== $B
    - metavariable-pattern:
        metavariable: $A
        pattern-either:
        - pattern: $C.createHmac(...). ... .digest(...)
        - pattern: crypto.createHmac(...). ... .digest(...)
  - patterns:
    - pattern-either:
      - pattern: $A == $B
      - pattern: $A === $B
      - pattern: $A != $B
      - pattern: $A !== $B
    - metavariable-pattern:
        metavariable: $B
        pattern-either:
        - pattern: $C.createHmac(...). ... .digest(...)
        - pattern: crypto.createHmac(...). ... .digest(...)
